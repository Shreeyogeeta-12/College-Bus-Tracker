<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>KLS GIT Bus Tracker</title>

  <!-- External: map styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <!-- External: font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <!-- App styles -->
  <link rel="stylesheet" href="css/common.css"/>
  <link rel="stylesheet" href="js/css/tracker.css"/>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
</head>
<body>

  <!-- ── Top panel ────────────────────────────────────────── -->
  <div id="topbar">
    <button id="togglePanelBtn" onclick="toggleTopbar()">▲</button>

    <div class="topbar-brand">
      <span class="logo">🚌</span>
      <div>
        <h1>KLS GIT Bus Tracker</h1>
        <p>Gogte Institute of Technology</p>
      </div>
      <div class="live-pill"><div class="live-dot"></div>LIVE</div>
    </div>

    <select id="shiftSelect" class="dropdown-style" onchange="onShiftChange()">
      <option value="">-- Select Shift --</option>
      <option value="morning730">7:30 AM Morning Pickup</option>
      <option value="morning900">9:00 AM Morning Pickup</option>
      <option value="drop130">1:30 PM Afternoon Drop</option>
      <option value="drop400">4:00 PM Evening Drop</option>
      <option value="drop515">5:15 PM Evening Drop</option>
    </select>

    <select id="busSelect" class="dropdown-style" onchange="selectBus()">
      <option value="">-- Select Shift First --</option>
    </select>

    <div id="info">Please select a tracking target.</div>
    <div id="driverInfo"></div>
  </div>

  <!-- ── Standalone ETA line — stays visible even when topbar is collapsed ── -->
  <div id="etaLineWrap">
    <div id="etaLine"></div>
  </div>

  <!-- ── Map ──────────────────────────────────────────────── -->
  <div id="map"></div>

  <!-- ── External libraries (order matters) ───────────────── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

  <!-- ── App scripts (data must load before logic) ────────── -->
  <script src="js/data/stops.js"></script>
  <script src="js/data/routes.js"></script>
  <script src="js/data/shifts.js"></script>
  <script src="js/data/drivers.js"></script>
  <script>
firebase.initializeApp({
  databaseURL: "https://college-bus-tracker-11fce-default-rtdb.firebaseio.com"
});
const db = firebase.database();
const CAMPUS_LOCATION = { lat: 15.8164, lng: 74.4835 };
const BELAGAVI_BOUNDS = [[15.7800, 74.4000], [15.9000, 74.6000]];
const OLA_MAPS_API_KEY = 's0OZq9XTSK6I8m2YxidijWQDa4JmxdgMCQvXglZo';
const SHIFT_END_CLEANUP_HOURS = 1;
const SPEED_BUFFER_SIZE = 10;
const CITY_DEFAULT_SPEED_MS = 25 / 3.6;
const ETA_TRAFFIC_BUFFER = 1.10;
// DRIVER_DB is already declared in js/data/drivers.js — do NOT redeclare it
// here. Redeclaring a const with the same name throws a SyntaxError that
// silently kills this entire script block (and everything after it,
// including the map), which was the actual cause of the blank map.
</script>
  <script src="js/utils.js"></script>
  <script src="js/tracker.js"></script>

  <!-- PWA service worker -->
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
